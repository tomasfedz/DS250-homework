name: Render and Publish Quarto Project
on:
  workflow_dispatch:
  push:
    branches: main

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: true

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy matplotlib seaborn scikit-learn xgboost
          # Adding additional packages specific to your project
          pip install jupyter nbformat nbclient

      # Try using direct quarto render command instead
      - name: Render Quarto Project
        run: |
          cd "Projects/Project 4" || cd .
          quarto render

      # Manual deployment to gh-pages
      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: "Projects/Project 4/_site" # Adjust if your output directory is different
          branch: gh-pages
