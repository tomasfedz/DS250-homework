name: Render and Publish Quarto Document

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: true

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy matplotlib seaborn scikit-learn xgboost
          pip install jupyter nbformat nbclient lets-plot

      # List files to debug (optional, for verification)
      - name: List directory structure
        run: |
          echo "Listing all .qmd files:"
          find . -type f -name "*.qmd" | sort
          echo "Checking for target file:"
          ls -l "Projects/Project 5/project5.qmd" || echo "Target file not found"

      # Render specific QMD file
      - name: Render Quarto Document
        run: |
          QMD_FILE="Projects/Project 5/project5.qmd"
          if [ ! -f "$QMD_FILE" ]; then
            echo "Error: $QMD_FILE not found in the repository"
            exit 1
          fi
          echo "Rendering $QMD_FILE"
          quarto render "$QMD_FILE" --to html

      # Deploy the rendered HTML to GitHub Pages
      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: "Projects/Project 5"  
          branch: gh-pages  # Changed to gh-pages for cleaner deployment
